[project]
name = "applenotes"
version = "0.1.0-rc4"
description = "Synchronize IMAP notes with editable plain-text files"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["pydantic>=2.12,<3", "pydantic-settings>=2.12,<3", "beautifulsoup4>=4.14,<5"]

[project.scripts]
applenotes = "applenotes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.15.11", "ty", "pre-commit", "tox>=4", "tox-uv>=1.29", "bandit>=1.9", "bump-my-version>=1.3", "gitlint-core>=0.19", "sh>=2.2.4; sys_platform != 'win32'", "packaging"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/applenotes"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src", "tests", "scripts", "docs", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "pyproject.toml", "uv.lock", ".bumpversion.toml", ".pre-commit-config.yaml", ".gitlint", ".python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=applenotes --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.29"]
env_list = ["py314"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
package = "wheel"
dependency_groups = ["dev"]
commands = [["pytest"], ["coverage", "json", "-o", ".coverage.json"], ["python", "scripts/check_coverage.py"]]
